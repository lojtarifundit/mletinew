<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marsed Leti - Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050505;
      --accent-soft: #5a5a5e;
      --accent: #c9c9ce;
      --panel-bg: rgba(16, 16, 18, 0.85);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text-muted: #85858a;
      --text-secondary: #9b9ba0; /* grey used for "LETI" / secondary headings */
      --text-tag: #b0b0b4;       /* grey used for small tags/labels that used to be red */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Animated Canvas Background */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Top Left Status Light */
    .top-left-status {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 30%, rgba(210, 210, 216, 0.2) 100%);
      box-shadow: 0 0 15px var(--accent);
      z-index: 10;
    }

    /* Hero Section */
    .hero-container {
      position: absolute;
      top: 28%;
      left: 8%;
      z-index: 10;
      max-width: 500px;
    }

    .sub-url {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .main-title {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .main-title .first-line {
      color: #ffffff;
      display: block;
    }

    .main-title .second-line {
      color: var(--text-secondary);
      display: block;
    }

    .hero-desc {
      margin-top: 2rem;
      font-size: 0.95rem;
      color: #a8a8ad;
      line-height: 1.5;
      font-weight: 300;
      max-width: 380px;
    }

    /* Action Buttons */
    .hero-actions {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .btn-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(24, 24, 26, 0.6);
      border: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(10px);
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-icon:hover {
      background: rgba(210, 210, 216, 0.2);
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .btn-studio {
      padding: 0.85rem 2rem;
      border-radius: 30px;
      background: rgba(32, 32, 35, 0.8);
      border: 1px solid rgba(210, 210, 216, 0.4);
      box-shadow: 0 0 15px rgba(210, 210, 216, 0.25);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-studio:hover {
      background: rgba(210, 210, 216, 0.16);
      border-color: rgba(230, 230, 236, 0.75);
      box-shadow: 0 0 25px rgba(210, 210, 216, 0.6);
      transform: translateY(-2px);
    }

    /* Settings Button */
    .settings-toggle {
      position: absolute;
      top: 2rem;
      right: 2.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.3s ease;
    }

    .settings-toggle:hover {
      border-color: var(--accent);
      transform: rotate(45deg);
    }

    /* Floating Controls Card - Music only */
    .control-card {
      position: absolute;
      top: 5.5rem;
      right: 2.5rem;
      width: 268px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.25rem 1.25rem 1.35rem;
      backdrop-filter: blur(20px);
      z-index: 20;
      font-size: 0.8rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .control-card.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
    }

    /* ---- Clock ---- */
    .clock-block {
      text-align: center;
      padding-bottom: 1.05rem;
      margin-bottom: 1.05rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .clock-time {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .clock-time .clock-meridiem {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-left: 0.3rem;
    }

    .clock-date {
      margin-top: 0.45rem;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ---- Music player ---- */
    .music-player {
      text-align: center;
    }

    .music-label {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .track-name {
      font-size: 0.78rem;
      font-weight: 500;
      color: #d2d2d8;
      margin-bottom: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 1.1em;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      margin-bottom: 1.15rem;
    }

    /* transparent glass circles */
    .ctrl-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #c9c9ce;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 0;
      transition: all 0.25s ease;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.06);
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 0 20px -4px rgba(210, 210, 216, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
      line-height: 0;
    }

    .play-btn svg {
      display: block;
    }

    .play-btn .icon-play {
      margin-left: 2px; /* optical centering for triangle glyph */
    }

    .play-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 28px -2px rgba(210, 210, 216, 0.55);
      transform: scale(1.06);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    /* loading ring on the play button */
    .play-btn.loading {
      pointer-events: none;
      opacity: 0.55;
    }

    /* ---- Volume row ---- */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      padding: 0.55rem 0.85rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .volume-icon {
      color: var(--text-muted);
      flex-shrink: 0;
      line-height: 0;
      cursor: pointer;
      transition: color 0.2s;
    }

    .volume-icon:hover {
      color: #ffffff;
    }

    .volume-container {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.14);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      touch-action: none;
    }

    .volume-level {
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, rgba(210, 210, 216, 0.55), #ffffff);
      border-radius: 2px;
      position: relative;
    }

    .volume-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.35);
      cursor: grab;
    }

    .volume-thumb:active {
      cursor: grabbing;
    }


    /* STUDIO MODAL POPUP */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 5, 0.35);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .studio-card {
      background: #0d0d0f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.4rem;
      width: 100%;
      max-width: 540px;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .studio-card {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.7rem;
      color: #85858a;
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #ffffff;
    }

    .studio-tag {
      color: var(--text-tag);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .studio-title {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.15;
      color: #ffffff;
      margin-bottom: 1.6rem;
      letter-spacing: -0.01em;
    }

    .approach-box {
      background: rgba(20, 20, 22, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 1.25rem;
    }

    /* Grid of 4 Interactive Cards */
    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .grid-btn {
      background: linear-gradient(160deg, #0d0d0e, #070707);
      border: 1px solid rgba(210, 210, 216, 0.28);
      border-radius: 16px;
      padding: 1.1rem 1.05rem;
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      display: block;
      box-shadow: 0 0 0 1px rgba(210, 210, 216, 0.08), 0 0 22px -6px rgba(210, 210, 216, 0.45);
      transition: all 0.25s ease;
    }

    .grid-btn.wide {
      grid-column: 1 / -1;
    }

    .grid-btn:hover {
      border-color: rgba(210, 210, 216, 0.55);
      background: linear-gradient(160deg, #16161a, #0a0a0b);
      box-shadow: 0 8px 22px rgba(210, 210, 216, 0.15);
      transform: translateY(-3px);
    }

    .btn-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.75rem;
    }

    .icon-badge {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 30%, rgba(210, 210, 216, 0.28), rgba(0, 0, 0, 0.55));
      border: 1px solid rgba(210, 210, 216, 0.4);
      color: var(--accent);
    }

    .btn-kicker {
      color: #9a9a9f;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .btn-label {
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }

    /* Mobile: stack the studio grid into a single column */
    @media (max-width: 600px) {
      .studio-card {
        padding: 2rem 1.4rem;
        border-radius: 22px;
        max-width: 92vw;
        max-height: 85vh;
        overflow-y: auto;
      }

      .studio-title {
        font-size: 1.5rem;
        margin-bottom: 1.25rem;
      }

      .approach-box {
        padding: 1rem;
        border-radius: 16px;
      }

      .studio-grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      .grid-btn {
        padding: 1.05rem 1.15rem;
        border-radius: 14px;
      }

      .btn-label {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="top-left-status"></div>

  <div class="hero-container">
    <div class="sub-url">PhD | Engineer</div>
    <h1 class="main-title">
      <span class="first-line">Marsed</span>
      <span class="second-line">Leti</span>
    </h1>
    <p class="hero-desc">
      Crafting atmosphere-driven indie titles and innovative gameplay mechanics.
    </p>
    <div class="hero-actions">
      <button class="btn-icon" id="btn-linkedin">in</button>
      <button class="btn-studio" id="btn-studio">Enter</button>
    </div>
  </div>

  <div class="settings-toggle" id="toggle-settings">⚙</div>

  <div class="control-card hidden" id="control-card">

    <div class="clock-block">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date">&nbsp;</div>
    </div>

    <div class="music-player">
      <div class="music-label">MUSIC</div>
      <div class="track-name" id="track-name">Loading playlist…</div>
      <div class="player-controls">
        <div class="ctrl-btn" id="music-prev-btn" title="Previous track">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </div>
        <div class="play-btn" id="music-play-btn" title="Play / pause">
          <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="ctrl-btn" id="music-next-btn" title="Next track">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </div>
      </div>
      <div class="volume-row">
        <span class="volume-icon" id="volume-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        </span>
        <div class="volume-container" id="volume-bar">
          <div class="volume-level" id="volume-level">
            <div class="volume-thumb" id="volume-thumb"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="studio-modal">
    <div class="studio-card">
      <div class="modal-close" id="modal-close">&times;</div>
      <div class="studio-tag">ML</div>
      <h2 class="studio-title">Chose Profiles</h2>

      <div class="approach-box">
        <div class="studio-grid">
          <a href="academic/index.html" class="grid-btn">
            <div class="btn-header">
              <div class="icon-badge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3 2 8l10 5 10-5-10-5Z"/>
                  <path d="M6 10.5v5c0 1 2.5 2.5 6 2.5s6-1.5 6-2.5v-5"/>
                  <path d="M22 8v6"/>
                </svg>
              </div>
              <span class="btn-kicker">Civil Engineering</span>
            </div>
            <div class="btn-label">Academic</div>
          </a>

          <a href="mlair.pro/index.html" class="grid-btn">
            <div class="btn-header">
              <div class="icon-badge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="7" width="13" height="10" rx="2"/>
                  <path d="M16 10.5 21 7v10l-5-3.5Z"/>
                </svg>
              </div>
              <span class="btn-kicker">mlair</span>
            </div>
            <div class="btn-label">Videography</div>
          </a>

          <div class="grid-btn wide" id="lojtariBtn">
            <div class="btn-header">
              <div class="icon-badge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="6" width="20" height="12" rx="6"/>
                  <line x1="6" y1="12" x2="10" y2="12"/>
                  <line x1="8" y1="10" x2="8" y2="14"/>
                  <circle cx="15" cy="13" r="0.6" fill="currentColor"/>
                  <circle cx="18" cy="11" r="0.6" fill="currentColor"/>
                </svg>
              </div>
              <span class="btn-kicker">LojtariFundit</span>
            </div>
            <div class="btn-label">Entertainment</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Canvas Animated Background ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.reset(true);
      }

      reset(isInitial = false) {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.baseSize = Math.random() * 140 + 90;
        this.size = isInitial ? this.baseSize : 0;
        this.targetSize = this.baseSize;
        
        this.vx = (Math.random() - 0.5) * 2.2;
        this.vy = (Math.random() - 0.5) * 2.2;
        
        this.baseAlpha = Math.random() * 0.35 + 0.15;
        this.alpha = isInitial ? this.baseAlpha : 0;
        this.targetAlpha = this.baseAlpha;

        this.fadeSpeed = 0.005 + Math.random() * 0.01;
        this.growSpeed = 0.5 + Math.random() * 1.0;

        this.pulseAngle = Math.random() * Math.PI * 2;
        this.pulseSpeed = Math.random() * 0.02 + 0.01;
        
        this.isFadingIn = !isInitial;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.isFadingIn) {
            if (this.alpha < this.targetAlpha) {
                this.alpha = Math.min(this.targetAlpha, this.alpha + this.fadeSpeed);
            }
            if (this.size < this.targetSize) {
                this.size = Math.min(this.targetSize, this.size + this.growSpeed);
            }
            if (this.alpha >= this.targetAlpha && this.size >= this.targetSize) {
                this.isFadingIn = false;
            }
        }

        if (!this.isFadingIn || this.size > this.targetSize * 0.8) {
            this.pulseAngle += this.pulseSpeed;
            const currentBase = this.isFadingIn ? this.size : this.baseSize;
            this.size = currentBase + Math.sin(this.pulseAngle) * 20 * (this.size / this.targetSize);
        }

        if (this.x < -120 || this.x > canvas.width + 120 || 
            this.y < -120 || this.y > canvas.height + 120) {
          this.reset(false);
        }
      }

      draw() {
        if (this.size <= 0) return;

        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, Math.max(1, this.size)
        );
        gradient.addColorStop(0, `rgba(170, 170, 178, ${this.alpha})`);
        gradient.addColorStop(1, 'rgba(5, 5, 5, 0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(1, this.size), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particles = Array.from({ length: 26 }, () => new Particle());

    function animate() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }
    animate();

    // --- Studio Modal Popup Toggle ---
    const btnStudio = document.getElementById('btn-studio');
    const studioModal = document.getElementById('studio-modal');
    const modalClose = document.getElementById('modal-close');

    btnStudio.addEventListener('click', () => {
      studioModal.classList.add('active');
    });

    modalClose.addEventListener('click', () => {
      studioModal.classList.remove('active');
    });

    // Close the popup itself before leaving for a real page, so it's not
    // left open behind you (or shown open if you hit the browser back button).
    document.querySelectorAll('.studio-grid a.grid-btn').forEach((link) => {
      link.addEventListener('click', () => {
        studioModal.classList.remove('active');
      });
    });

    studioModal.addEventListener('click', (e) => {
      if (e.target === studioModal) {
        studioModal.classList.remove('active');
      }
    });

    // --- Live clock (date + time) ---
    const clockTimeEl = document.getElementById('clock-time');
    const clockDateEl = document.getElementById('clock-date');

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const meridiem = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      clockTimeEl.innerHTML = `${h}:${m}<span class="clock-meridiem">${meridiem}</span>`;
      clockDateEl.textContent = now.toLocaleDateString(undefined, {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // --- Audio Player Setup ---
    // Playlist lives in the repo folder below. The track list is pulled from the
    // GitHub API at runtime, so dropping a new song into the folder is enough —
    // no code change needed, and every file in the folder gets played.
    const GH_OWNER  = 'lojtarifundit';
    const GH_REPO   = 'mletinew';
    const GH_BRANCH = 'main';
    const GH_FOLDER = 'Music Webi';

    // Optional manual override. If you ever want to pin an exact order, list the
    // file names here (e.g. ['song-a.mp3', 'song-b.mp3']) and the API is skipped.
    const MANUAL_PLAYLIST = [];

    const AUDIO_EXT = /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i;

    const audio = new Audio();
    audio.preload = 'metadata';
    audio.volume = 0.7;

    let playlist = [];       // [{ name, url }]
    let currentIndex = 0;
    let playlistReady = false;
    let wantsToPlay = false; // user pressed play before the list finished loading

    const playBtn    = document.getElementById('music-play-btn');
    const volumeBar  = document.getElementById('volume-bar');
    const volumeLevel = document.getElementById('volume-level');
    const volumeThumb = document.getElementById('volume-thumb');
    const volumeIcon = document.getElementById('volume-icon');
    const prevBtn    = document.getElementById('music-prev-btn');
    const nextBtn    = document.getElementById('music-next-btn');
    const trackNameEl = document.getElementById('track-name');

    const ICON_PLAY  = '<svg class="icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

    function prettyName(fileName) {
      return decodeURIComponent(fileName)
        .replace(AUDIO_EXT, '')
        .replace(/[_]+/g, ' ')
        .trim();
    }

    function rawUrl(fileName) {
      return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/` +
             `${encodeURIComponent(GH_FOLDER)}/${encodeURIComponent(fileName)}`;
    }

    async function loadPlaylist() {
      if (MANUAL_PLAYLIST.length) {
        playlist = MANUAL_PLAYLIST.map(f => ({ name: prettyName(f), url: rawUrl(f) }));
      } else {
        const api = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/` +
                    `${encodeURIComponent(GH_FOLDER)}?ref=${GH_BRANCH}`;
        try {
          const res = await fetch(api);
          if (!res.ok) throw new Error(`GitHub API ${res.status}`);
          const files = await res.json();
          playlist = files
            .filter(f => f.type === 'file' && AUDIO_EXT.test(f.name))
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
            .map(f => ({ name: prettyName(f.name), url: f.download_url || rawUrl(f.name) }));
        } catch (err) {
          console.error('Could not load playlist:', err);
          trackNameEl.textContent = 'Playlist unavailable';
          playBtn.classList.remove('loading');
          return;
        }
      }

      if (!playlist.length) {
        trackNameEl.textContent = 'No tracks found';
        playBtn.classList.remove('loading');
        return;
      }

      playlistReady = true;
      playBtn.classList.remove('loading');
      loadTrack(0, wantsToPlay);
    }

    function loadTrack(index, autoplay) {
      if (!playlist.length) return;
      currentIndex = (index + playlist.length) % playlist.length;
      const track = playlist[currentIndex];
      audio.src = track.url;
      trackNameEl.textContent = `${currentIndex + 1}/${playlist.length} · ${track.name}`;
      trackNameEl.title = track.name;
      if (autoplay) play();
    }

    function play() {
      audio.play()
        .then(() => { playBtn.innerHTML = ICON_PAUSE; })
        .catch(err => {
          console.error('Audio play error:', err);
          playBtn.innerHTML = ICON_PLAY;
        });
    }

    function pause() {
      audio.pause();
      playBtn.innerHTML = ICON_PLAY;
    }

    playBtn.classList.add('loading');
    loadPlaylist();

    playBtn.addEventListener('click', () => {
      if (!playlistReady) { wantsToPlay = true; return; }
      if (audio.paused) play(); else pause();
    });

    nextBtn.addEventListener('click', () => {
      if (!playlistReady) return;
      loadTrack(currentIndex + 1, !audio.paused || audio.currentTime > 0);
    });

    prevBtn.addEventListener('click', () => {
      if (!playlistReady) return;
      // Tapping back mid-song restarts it first, like a normal player.
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadTrack(currentIndex - 1, !audio.paused || audio.currentTime > 0);
      }
    });

    // Rolls straight into the next file, and wraps around at the end so the
    // whole folder keeps cycling.
    audio.addEventListener('ended', () => loadTrack(currentIndex + 1, true));

    // If one file is missing or unplayable, skip past it instead of stalling.
    audio.addEventListener('error', () => {
      if (!playlistReady || playlist.length < 2) return;
      console.warn('Skipping unplayable track:', playlist[currentIndex]?.name);
      loadTrack(currentIndex + 1, true);
    });

    // --- Volume: click, drag, and mute toggle ---
    let lastVolume = 0.7;

    function applyVolume(v) {
      audio.volume = v;
      volumeLevel.style.width = `${v * 100}%`;
    }

    function setVolumeFromClientX(clientX) {
      const rect = volumeBar.getBoundingClientRect();
      const newVolume = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
      applyVolume(newVolume);
      if (newVolume > 0) lastVolume = newVolume;
    }

    volumeBar.addEventListener('click', (e) => setVolumeFromClientX(e.clientX));

    volumeIcon.addEventListener('click', () => {
      applyVolume(audio.volume > 0 ? 0 : (lastVolume || 0.7));
    });

    let isDraggingVolume = false;

    volumeThumb.addEventListener('pointerdown', (e) => {
      isDraggingVolume = true;
      volumeThumb.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });

    volumeThumb.addEventListener('pointermove', (e) => {
      if (!isDraggingVolume) return;
      setVolumeFromClientX(e.clientX);
    });

    volumeThumb.addEventListener('pointerup', (e) => {
      isDraggingVolume = false;
      volumeThumb.releasePointerCapture(e.pointerId);
    });

    // --- Settings panel visibility ---
    const settingsToggle = document.getElementById('toggle-settings');
    const controlCard = document.getElementById('control-card');

    settingsToggle.addEventListener('click', () => {
      controlCard.classList.toggle('hidden');
    });
  </script>
</body>
</html>
