<!--
  WHY THIS FILE EXISTS
  ---------------------------------------------------------------------------
  GitHub Pages is a static host: there is no real folder at /academic/CE121,
  so a normal request for it 404s. What this file does is turn that 404 into
  the right page. GitHub Pages serves the BODY of this file for any URL that
  doesn't match a real path, but the browser's address bar keeps showing the
  URL the visitor actually typed — so /academic/CE121 stays /academic/CE121,
  it just quietly renders using the same script that /academic/course.html
  uses, reading the course code from the URL instead of a query string.

  If the mistyped/unknown URL isn't under /academic/ at all, this sends the
  visitor back to the homepage instead of showing a raw 404.
-->
<script>
  (function(){
    var path = location.pathname.replace(/\/+$/, '');
    if(path.indexOf('/academic') !== 0){
      location.replace('/');
    }
  })();
</script>
